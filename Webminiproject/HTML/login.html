<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="shortcut icon" type="image/x-icon" href="photo/logoweb.png">
    <link rel="stylesheet" href="CSS/login.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@500&family=Kanit&display=swap" rel="stylesheet">
</head>
<body>
    <div class="login-box">
        <h2>Login</h2>
        <form id="login-form">
            <div class="user-box">
                <input  type="text" id="username" name="" required="">
                <label>Username</label>
            </div>
            <div class="user-box">
                <input type="password" id="password" name="" required="">
                <label>Password</label>
            </div>
            <button type="submit">Submit</button>
            <a href="register.html" style="color: #fff; font-size: 15px;">Don't have an account?</a>
        </form>
    </div>
    <script src="JavaScript/login.js"></script>
</body>
</html>
